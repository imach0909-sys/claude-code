name: Esutech Daily News Bot

on:
  schedule:
    # 22:00 UTC = 07:00 JST 翌朝
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch only, do not post)'
        required: false
        default: 'false'

jobs:
  post-daily-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to commit posted_news.json back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run news bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/daily_news.py

      - name: Commit updated news history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/posted_news.json
          git diff --staged --quiet || git commit -m "chore: update posted news history [skip ci]"
          git push origin HEAD
